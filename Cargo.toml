[package]
name = "nu_plugin_render"
version = "0.1.0"
edition = "2024"
description = "A Nushell plugin that draws tables as pictures in the terminal, with kitty graphics or sixel"
license = "MIT"
repository = "https://github.com/fdncred/nu_plugin_render"
readme = "README.md"
keywords = ["nushell", "plugin", "table", "kitty", "sixel"]
categories = ["command-line-utilities"]
include = ["/src", "/tests", "/README.md", "/LICENSE"]

[dependencies]
arboard = { version = "3.7.0", default-features = false, features = ["image-data", "wayland-data-control"] }
base64 = "0.23.1"
devicons = "0.6.13"
fontdb = "0.24.0"
icy_sixel = "0.7.0"
lscolors = "0.21.0"
nu-ansi-term = "0.50.3"
nu-color-config = "0.117.0"
nu-plugin = "0.117.0"
nu-protocol = "0.117.0"
nu-utils = "0.117.0"
png = "0.18.1"
swash = "0.2.10"
unicode-width = "0.2.3"

[target."cfg(unix)".dependencies]
libc = "0.2.191"

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
# Without symbols the macOS binary is a third smaller.
strip = "symbols"

# `cargo binstall` downloads the archives dist uploads to each GitHub release.
# They hold the binary in a folder named after the archive, except on Windows,
# where the zip has no folder.
[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/v{ version }/{ name }-{ target }{ archive-suffix }"
bin-dir = "{ name }-{ target }/{ bin }{ binary-ext }"
pkg-fmt = "txz"

[package.metadata.binstall.overrides.x86_64-pc-windows-msvc]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"

[package.metadata.binstall.overrides.aarch64-pc-windows-msvc]
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "zip"
